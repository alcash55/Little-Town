name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    uses: alcash55/ac-composite-actions/.github/workflows/security-analysis.yml@a82b58bce1d42d348ec2643e634adbbb9d14a494
