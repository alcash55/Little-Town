name: Keep Diamond Dogs warm

on:
  schedule:
    # Every five minutes, away from the busy start of each hour.
    # GitHub schedules can be delayed and disable after 60 days of inactivity.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping Diamond Dogs health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # No checkout, credentials, or application writes are needed.
      - name: Check API health
        run: |
          curl --fail --silent --show-error --connect-timeout 15 --max-time 90 \
            https://diamond-dogs-bingo.onrender.com/api/health \
            --output health.json
          python3 -c 'import json, sys; sys.exit(json.load(open("health.json")).get("status") != "OK")'
