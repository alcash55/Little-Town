name: CI

# Each workspace has its own bun.lock and test runner. Run frontend tests
# through Vitest, not the root bun-test configuration, which targets backend.
#
# Bun is pinned to 1.3.14:
# both lockfiles use the "configVersion" field, which older Bun releases do
# not write. The failure mode is worse than an error, which is why the pin
# is not optional -- 1.1.34 does not reject the lockfile, it silently
# ignores the pinned versions and re-resolves newer ones from the semver
# ranges (measured: @supabase/supabase-js 2.107.0 -> 2.112.4, discord.js
# 14.26.4 -> 14.27.0), with no warning. That defeats the entire contract of
# --frozen-lockfile while still reporting success.
#
# The frontend job supplies its public API URL only to the build step.
# Tests control their own environment to exercise missing/invalid URLs.
#
# Backend tests require a local Supabase stack (issue #41). They self-skip
# unless TEST_SUPABASE_URL/TEST_SUPABASE_SERVICE_ROLE_KEY point at a real
# Supabase target (see tests/integration/helpers.ts). Start the stack (already
# available on ubuntu-latest -- ships Docker), point the two TEST_ vars at
# it, and fail the job outright if that stack never comes up, rather than
# letting the suite quietly fall back into a wall of skips that still
# reads as green.
on:
  pull_request:
  push:
    branches: ["main"]

# #61: without this, every push to an open PR queued a second full backend
# run (local Supabase stack included) on top of the still-running first one
# instead of replacing it. Scoped to the ref so pushes to different PRs
# still run in parallel with each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend — install / test (local Supabase)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # First start on a fresh CI runner applies every migration in
      # supabase/migrations/ plus supabase/seed.sql (config.toml's
      # [db.seed]) to a brand-new local Postgres -- equivalent to
      # `db:reset`, no separate step needed.
      - name: Start local Supabase stack
        run: bun x supabase start

      - name: Resolve TEST_SUPABASE_URL / TEST_SUPABASE_SERVICE_ROLE_KEY
        id: supabase
        run: |
          status="$(bun x supabase status -o env)"
          url="$(printf '%s\n' "$status" | grep -oP '(?<=^API_URL=")[^"]*')"
          key="$(printf '%s\n' "$status" | grep -oP '(?<=^SERVICE_ROLE_KEY=")[^"]*')"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Could not read API_URL/SERVICE_ROLE_KEY from 'supabase status -o env' -- the local stack did not come up cleanly."
            exit 1
          fi
          echo "::add-mask::$key"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Belt-and-suspenders ahead of the test run itself: tests/integration/
      # helpers.ts already treats an unreachable stack as "skip", by design,
      # for a developer's local machine without `db:start` run. CI is not a
      # developer's machine -- an unreachable stack here is a broken
      # pipeline, not a reason to fall back to skipping, so this step fails
      # the job outright instead of letting that skip path absorb it.
      - name: Verify the local stack is actually reachable
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: ${{ steps.supabase.outputs.key }}" "${{ steps.supabase.outputs.url }}/rest/v1/" || echo 000)"
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "::error::Local Supabase REST responded '$code' at the resolved URL -- failing the job rather than letting bun test's own reachability check quietly skip everything."
            exit 1
          fi

      - name: Run backend tests
        env:
          TEST_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.key }}
        run: bun run test 2>&1 | tee test-output.log

      # Regression guard for the exact failure mode issue #41 reported: a
      # green run that only ever executed 239 of 526 tests. ALLOWED_SKIP is
      # a deliberately generous buffer (not zero) for the handful of tests
      # that skip for a real, currently-legitimate reason -- e.g. helpers.ts'
      # columnExists()-gated tests for a migration that hasn't landed on
      # main yet. If this ever fires, read test-output.log for which
      # describe.skipIf blocks fired and why before raising the number.
      #
      # bun test OMITS the "<N> skip" line entirely when the skip count is
      # exactly 0 -- it does not print "0 skip" -- confirmed against a real
      # run of this workflow. So no match is the good case (0 skipped), not
      # a parse failure; "Ran <N> tests" is checked separately as the sanity
      # check that this is actually bun's summary output and not some other
      # failure upstream.
      - name: Fail if the skip count regresses back toward the old wall of skips
        run: |
          ALLOWED_SKIP=10
          if ! grep -qP '^Ran [0-9]+ tests? across [0-9]+ files?\.' test-output.log; then
            echo "::error::Could not find bun test's 'Ran <N> tests...' summary line -- the test runner's output format may have changed, or the run failed before printing a summary."
            exit 1
          fi
          skipped="$(grep -oP '^\s*\K[0-9]+(?= skip$)' test-output.log | tail -1)"
          skipped="${skipped:-0}"
          echo "Skipped: $skipped (allowed: <= $ALLOWED_SKIP)"
          if [ "$skipped" -gt "$ALLOWED_SKIP" ]; then
            echo "::error::$skipped tests skipped, more than the $ALLOWED_SKIP allowed -- see test-output.log for which describe.skipIf blocks fired."
            exit 1
          fi

      - name: Stop local Supabase stack
        if: always()
        run: bun x supabase stop

  frontend:
    name: frontend — install / lint / typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        env:
          VITE_BASEURL: https://little-town.onrender.com
        run: bun run build

  # #76: README.md's Pages table and CLAUDE.md's used to drift apart by
  # hand. CLAUDE.md now just points at the README instead of keeping its
  # own copy, which removes one of the two things that could drift, but
  # the README can still fall behind Routes.tsx whenever a route changes.
  # This job catches that case in CI instead of waiting for someone to
  # notice on their own.
  docs-drift:
    name: docs — README Pages table matches Routes.tsx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Check README Pages table against Routes.tsx
        run: bun run tools/check-pages-doc.ts
