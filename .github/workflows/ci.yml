name: CI

# This repo has no CI at all today despite being under active development.
# Two workspaces, each with its own bun.lock, so this calls the shared
# reusable workflow once per workspace rather than once at the root --
# bunfig.toml pins the repo-root `bun test` to backend only (bun's own test
# runner ships a partial `vi` shim and breaks on frontend's real Vitest
# files), so running a workspace's own `test` script from its own working
# directory is the only way both suites actually run under the runner they
# were written for.
#
# BUN_VERSION is pinned above the reusable workflow's own default (1.1.34):
# both lockfiles use the "configVersion" field, which older Bun releases do
# not write. The failure mode is worse than an error, which is why the pin
# is not optional -- 1.1.34 does not reject the lockfile, it silently
# ignores the pinned versions and re-resolves newer ones from the semver
# ranges (measured: @supabase/supabase-js 2.107.0 -> 2.112.4, discord.js
# 14.26.4 -> 14.27.0), with no warning. That defeats the entire contract of
# --frozen-lockfile while still reporting success.
#
# Neither workspace has a `lint` or `typecheck` script -- the reusable
# workflow skips both automatically since neither script name exists in
# either package.json.
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    uses: alcash55/ac-composite-actions/.github/workflows/node-ci.yml@main
    with:
      WORKING_DIRECTORY: backend
      PACKAGE_MANAGER: bun
      BUN_VERSION: "1.3.14"

  frontend:
    uses: alcash55/ac-composite-actions/.github/workflows/node-ci.yml@main
    with:
      WORKING_DIRECTORY: frontend
      PACKAGE_MANAGER: bun
      BUN_VERSION: "1.3.14"
